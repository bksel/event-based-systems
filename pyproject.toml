[project]
name = "espresso-supervisor"
version = "0.1.0"
description = "Supervisory event-based control of an automatic espresso machine (Event Based Control course project)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The simulator package lives in sim/espresso; uv sync installs it in editable mode.
module-name = "espresso"
module-root = "sim"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["kbcheck", "newdoc", "ndrlayout", "espresso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
