name: Bug
description: Something in the model, simulator, tooling or docs is wrong
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Petri net model
        - Simulator
        - GUI
        - Knowledge base
        - Tooling
        - Reports
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: For the model or simulator, give the event sequence that leads to it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: Link the requirement it violates (S1–S6, L1–L3), if any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      render: shell
